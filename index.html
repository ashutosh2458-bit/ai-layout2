<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout Forge – infinite website layouts</title>
<style>
:root{--bg:#e9edf1;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#cfd7de;--acc:#0b6e6e}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3946;--acc:#4fd1c5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:300px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 1.35rem Georgia,serif;margin:0}
label{display:grid;gap:4px;font-weight:600}
input[type=text],select{padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit}
fieldset{border:1px solid var(--line);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
legend{font-weight:600;padding:0 6px}fieldset label{font-weight:400;display:flex;gap:6px}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--panel);cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btns{display:flex;gap:8px}.btns button{flex:1}
main{display:grid;grid-template-rows:auto 1fr;min-width:0}
.bar{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center;flex-wrap:wrap}
.tab{background:transparent;color:var(--ink);border-color:transparent}
.tab[aria-selected=true]{border-color:var(--acc);color:var(--acc)}
.bar .sp{flex:1}.bar small{color:var(--mute)}
#view{position:relative;min-height:0}
iframe,pre{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0}
iframe{background:#fff}
pre{overflow:auto;padding:18px;background:var(--panel);font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;tab-size:2}
#status{padding:24px;color:var(--mute)}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 70vh;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>Layout Forge</h1>
  <p style="margin:0;color:var(--mute)">Generates a new website layout from a seed. Python runs in your browser through WebAssembly.</p>
  <label>What is the site about?<input id="topic" type="text" value="your business"></label>
  <label>Mood
    <select id="mood"><option>any</option><option>clean</option><option>bold</option><option>elegant</option><option>playful</option></select>
  </label>
  <label>Level
    <select id="level"><option value="easy">Easy – short pages</option><option value="medium" selected>Medium – full pages</option><option value="hard">Hard – full pages + extra features</option></select>
  </label>
  <label>How many pages<input id="count" type="number" min="1" max="8" value="4"></label>
  <fieldset id="pages"><legend>Which pages</legend></fieldset>
  <label style="font-weight:400;display:flex;gap:8px"><input id="js" type="checkbox" checked> Include JavaScript</label>
  <div class="btns"><button id="prev" class="ghost">Back</button><button id="gen" disabled>Generate</button></div>
  <small id="seedinfo" style="color:var(--mute)"></small>
</aside>
<main>
  <div class="bar" role="tablist">
    <button class="tab" role="tab" data-t="preview" aria-selected="true">Preview</button>
    <button class="tab" role="tab" data-t="html">HTML</button>
    <button class="tab" role="tab" data-t="css">CSS</button>
    <button class="tab" role="tab" data-t="js">JS</button>
    <select id="pagesel" aria-label="Page"></select>
    <span class="sp"></span>
    <button id="copy" class="ghost">Copy code</button>
    <button id="dl" class="ghost">Download site (.zip)</button>
  </div>
  <div id="view"><div id="status">Loading Python (WebAssembly)…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const PAGES=[["home","Home"],["about","About"],["services","Services"],["pricing","Pricing"],["gallery","Gallery"],["blog","Blog"],["contact","Contact"],["faq","FAQ"]];
const $=id=>document.getElementById(id);
$("pages").insertAdjacentHTML("beforeend",PAGES.map(([k,t],i)=>`<label><input type="checkbox" value="${k}" ${i<2||k==="contact"||k==="services"?"checked":""} ${k==="home"?"disabled checked":""}>${t}</label>`).join(""));
const boxes=()=>[...document.querySelectorAll("#pages input")];
const syncCount=()=>{$("count").value=boxes().filter(b=>b.checked).length};
syncCount();
boxes().forEach(b=>b.onchange=syncCount);
$("count").onchange=()=>{ // pick the first N pages in the list; Home is always included
  const n=Math.max(1,Math.min(8,+$("count").value||1));let left=n;
  boxes().forEach(b=>{b.checked=b.value==="home"||left>1&&(left--,true)});
  if(n===1)boxes().forEach(b=>b.checked=b.value==="home");syncCount()};
let py,gen,history=[],pos=-1,tab="preview",cur="index.html";

async function boot(){
  py=await loadPyodide();
  py.runPython(await (await fetch("layout_engine.py?v="+Date.now(),{cache:"no-store"})).text());
  gen=py.globals.get("generate");
  $("gen").disabled=false;
  make();
}
function make(seed){
  const pages=boxes().filter(b=>b.checked).map(b=>b.value);
  seed=seed??Math.floor(Math.random()*2**31);
  const out=JSON.parse(gen(seed,$("topic").value,$("mood").value,$("level").value,py.toPy(pages),$("js").checked));
  history=history.slice(0,pos+1);history.push(out);pos=history.length-1;
  if(!out.pages.includes(cur))cur="index.html";show();
}
function show(){
  const d=history[pos];if(!d)return;
  if(!d.pages.includes(cur))cur="index.html";
  $("pagesel").innerHTML=d.pages.map(p=>`<option ${p===cur?"selected":""}>${p}</option>`).join("");
  $("seedinfo").textContent=`Layout ${pos+1} of ${history.length} · seed ${d.seed} · ${d.pages.length} page${d.pages.length>1?"s":""}`;
  $("prev").disabled=pos<1;
  const v=$("view");
  if(tab==="preview"){
    v.innerHTML='<iframe title="Preview"></iframe>';const f=v.firstChild;f.srcdoc=d.previews[cur];
    f.onload=()=>f.contentDocument.addEventListener("click",e=>{ // links between pages work inside the preview
      const a=e.target.closest("a"),h=a&&a.getAttribute("href");
      if(h&&d.previews[h.split("#")[0]]){e.preventDefault();cur=h.split("#")[0];show()}});
  }else{v.innerHTML="<pre></pre>";v.firstChild.textContent=(tab==="html"?d.files[cur]:d.files[tab==="css"?"style.css":"script.js"])||"/* JavaScript is turned off for this layout. */"}
}
$("pagesel").onchange=e=>{cur=e.target.value;show()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));show()});
$("gen").onclick=()=>make();
$("prev").onclick=()=>{if(pos>0){pos--;show()}};
$("copy").onclick=async e=>{
  const d=history[pos];if(!d)return;
  await navigator.clipboard.writeText(tab==="css"?d.files["style.css"]:tab==="js"?d.files["script.js"]||"":d.files[cur]);
  e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy code",1200)};
$("dl").onclick=()=>{
  const d=history[pos];if(!d)return;
  const a=document.createElement("a");a.href=URL.createObjectURL(zip(d.files));a.download=d.brand.toLowerCase()+"-site.zip";a.click()};

function crc(b){let c,t=crc.t||(crc.t=Array.from({length:256},(_,n)=>{c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0}));let x=-1;for(const v of b)x=t[(x^v)&255]^(x>>>8);return(x^-1)>>>0}
function zip(files){ // small store-only zip writer, so the whole site downloads as one file
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const [name,text] of Object.entries(files)){
    const n=enc.encode(name),d=enc.encode(text),c=crc(d),h=new DataView(new ArrayBuffer(30)),e=new DataView(new ArrayBuffer(46));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x800,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,n.length,true);e.setUint32(42,off,true);
    parts.push(h.buffer,n,d);cen.push(e.buffer,n);off+=30+n.length+d.length}
  const end=new DataView(new ArrayBuffer(22)),cnt=Object.keys(files).length;
  end.setUint32(0,0x06054b50,true);end.setUint16(8,cnt,true);end.setUint16(10,cnt,true);end.setUint32(12,cen.reduce((s,p)=>s+p.byteLength,0),true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:"application/zip"})}
boot().catch(e=>$("view").innerHTML=`<div id="status">Could not start Python: ${e.message}. Open this page through a web server (GitHub Pages), not as a local file, and make sure the newest layout_engine.py is uploaded next to index.html.</div>`);
</script>
</body>
</html>
